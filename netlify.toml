# Netlify settings for the GZX Gaming prize spinner.
# Only the "public" folder is uploaded; there is no build step.
[build]
  publish = "public"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# The poster rarely changes — let browsers cache it for a day.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
